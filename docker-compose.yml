# CodeMastery — local development / self-hosted with Docker Compose
# Usage:
#   docker compose up -d          # app + postgres (recommended)
#   docker compose up -d postgres  # just the DB (if you run `bun run dev` natively)
#
# This is the easiest production-like setup: a PostgreSQL 16 service with a
# persistent volume + the standalone Next.js app. No .env edits required —
# the env below points the app at the postgres service automatically.
# Override any of these by editing .env (the env_file line below).

services:
  # ---------- App (Next.js standalone) ----------
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PRISMA_DRIVER=pg
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://codemastery:codemastery@postgres:5432/codemastery
      # IMPORTANT: override AUTH_SECRET in .env with `openssl rand -base64 32`
      - STORAGE_PROVIDER=local
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped
    # After the container starts, run the seed once to populate content:
    #   docker compose exec app bun run db:seed

  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codemastery
      POSTGRES_PASSWORD: codemastery
      POSTGRES_DB: codemastery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemastery -d codemastery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
